[username]
format = "[$user](fg:white)"
style_root = "fg:red"
show_always = true

[hostname]
format = "[@](fg:subtext0)[$hostname](fg:text) "
ssh_only = false

[directory]
style = "fg:text"
format = "[$read_only]($read_only_style)[$path](fg:text) "
read_only = "󰌾 "
read_only_style = "fg:red"
truncate_to_repo = false
truncation_length = 3

[character]
success_symbol = "[❯](fg:blue)"
error_symbol = "[❯](fg:red)"


















































